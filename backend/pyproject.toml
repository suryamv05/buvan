[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "valorant-backend"
version = "0.1.0"
description = "Secure API backend for a VALORANT strategy and stats platform"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi==0.162.0",
  "uvicorn[standard]==0.54.0",
  "sqlalchemy[asyncio]==2.0.54",
  "asyncpg==0.32.0",
  "alembic==1.20.1",
  "pydantic==2.14.3",
  "pydantic-settings==2.16.2",
  "python-dotenv==1.2.2",
  "PyJWT==2.15.1",
  "pwdlib[argon2]==0.3.1",
  "redis==7.2.2",
  "celery==5.6.3",
  "boto3==1.43.124",
  "httpx==0.28.1",
  "structlog==26.1.0",
  "prometheus-client==0.21.1",
  "email-validator==2.3.0",
]

[project.optional-dependencies]
dev = [
  "pytest==9.2.0",
  "pytest-asyncio==1.4.1.post1",
  "pytest-cov==7.1.0",
  "pip-tools==7.6.2",
  "httpx==0.28.1",
  "ruff==0.16.10",
  "mypy==1.20.2",
  "bandit==1.9.4",
  "pip-audit==2.10.1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]

[tool.bandit]
exclude_dirs = ["tests", "alembic"]
skips = ["B101"]
